services:
  codemarket:
    build:
      context: .
      dockerfile: Dockerfile
    image: codemarket:local
    init: true
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: file:/data/codemarket.db
      SERVE_CLIENT: "true"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - codemarket_data:/data
      - codemarket_uploads:/app/server/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  codemarket_data:
  codemarket_uploads:
